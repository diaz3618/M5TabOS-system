dependencies:
  # override_path points at the COPY ALREADY IN THE PROJECT. Two reasons:
  # it builds without network access, and it guarantees the coprocessor and
  # the host speak exactly the same esp_hosted version - a version mismatch
  # between the two sides is precisely the kind of bug this is meant to avoid.
  espressif/esp_hosted:
    version: '*'
    override_path: '../../managed_components/espressif__esp_hosted'
  idf:
    version: '>=5.5'
  # THE OFFICIAL CARDPUTER'S ESP-NOW: the M5Cardputer-UserDemo chat uses
  # Espressif's esp-now component, which prefixes the text with its own
  # header (type, size, anti-repeat marker) and retransmits. Same library,
  # same version = same over-the-air format, by construction.
  espressif/esp-now:
    version: '2.5.3'   # same over-the-air format as the Cardputer's 2.5.1 (per Espressif's own code comments); 2.5.1 does not build on IDF 5.5
